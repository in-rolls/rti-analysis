name: Analysis and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: r-lib/actions/setup-r@v2.14.0
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-xetex texlive-latex-recommended texlive-latex-extra lmodern
      - uses: r-lib/actions/setup-renv@v2.14.0
      - run: make check
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: rti-paper
          path: |
            ms/*.pdf
            tabs/
            figs/
            other/r_packages_info.csv
